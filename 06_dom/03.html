<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai aur code </title>
</head>

<body style="background-color: #212121; color: #fff;">

</body>
<script>
    //here you are just creating but didnt attach to the body
    const div = document.createElement('div')
    console.log(div);
    div.className = "main"
    // div.id = Math.round(Math.random() * 10 + 1)
    div.setAttribute("title", "generated title")
    div.style.backgroundColor = "green"
    div.style.padding = "12px"
    //div.innerText first brings the text and then overwrites it
    // so this is not that optimal
    // div.innerText = "Chai aur code"
    //methods like setAttribute,createTextNode are more optimal
    // as they create new nodes and dont overwrite the existing ones
    const addText = document.createTextNode("Chai aur code")
    //appendChild is used to add the node to the parent node
    div.appendChild(addText)

    //after creating the div, we need to append to the body
    document.body.appendChild(div)
</script>

</html>
